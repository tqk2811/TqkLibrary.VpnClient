# strongswan.conf — charon cho lab/ikev2-ppk (IKEv2 PSK + PPK + CP virtual IP).
charon {
    # Cấp virtual IP từ pool cho client (Configuration Payload).
    install_routes = yes
    install_virtual_ip = yes

    # Log ra stderr để `docker compose logs` thấy handshake + PPK + CHILD_SA.
    # (ike=3/cfg=2 đủ thấy quyết định PPK "PPK required but no PPK_IDENTITY received";
    #  bump ike=4 nếu cần dump payload hex khi debug interop PPK_ID.)
    filelog {
        stderr {
            default = 1
            ike = 3
            knl = 1
            cfg = 2
        }
    }
}
