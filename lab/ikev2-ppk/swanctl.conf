# =====================================================================
# swanctl.conf — lab/ikev2-ppk (strongSwan 5.9.13, vici/swanctl)
# IKEv2 PSK + **PPK (RFC 8784)** + ESP TUNNEL + CP virtual IP/DNS.
#
# Transform PHẢI khớp đề xuất của IkeClient (V2) — xem IkeProposals.cs:
#   IKE (Phase 1): AES-CBC-256 + PRF_HMAC_SHA2_256 + AUTH_HMAC_SHA2_256_128 + MODP2048
#                  => proposals = aes256-sha256-modp2048
#   ESP (CHILD)  : #1 AES-CBC-256 + HMAC-SHA2_256_128 (no PFS, no ESN); #2 AES-GCM-16-256
#                  => esp_proposals = aes256-sha256-noesn,aes256gcm16-noesn
#
# PPK khớp client demo:  --ppk 0x0011...0011  --ppk-id ppk1
#   - PPK_ID: client gửi PPK_IDENTITY = [type=1 PPK_ID_OPAQUE][ "ppk1" ];
#     swanctl `id = ppk1` (strongSwan tự prepend type octet OPAQUE) ⇒ khớp.
#   - PPK secret: 32 byte hex, PHẢI trùng hai phía.
#   - ppk_required = no  ⇒ PPK **tùy chọn**: nếu client không gửi USE_PPK thì tunnel
#     vẫn lên (PSK thường). Đổi = yes để BẮT BUỘC PPK (client thiếu PPK ⇒ từ chối).
# =====================================================================

connections {

    ikev2-ppk {
        version = 2
        proposals = aes256-sha256-modp2048
        # remote-access: nhiều client / reconnect cùng id (CP IDi = 0.0.0.0).
        unique = never
        # DPD (driver gửi INFORMATIONAL DPD mỗi ~20s).
        dpd_delay = 30s

        # PPK (RFC 8784): thương lượng USE_PPK; nhận PPK_IDENTITY 'ppk1'.
        ppk_id = ppk1
        ppk_required = no

        pools = ppk_pool

        local {
            auth = psk
            id = %any
        }
        remote {
            auth = psk
            id = %any
        }

        children {
            net {
                esp_proposals = aes256-sha256-noesn,aes256gcm16-noesn
                # TSr match-all IPv4 (client offer TSi/TSr match-all).
                local_ts = 0.0.0.0/0
                mode = tunnel
                dpd_action = clear
                # Rekey dài để không rớt trong phiên lab ngắn.
                rekey_time = 0
            }
        }
    }
}

secrets {
    # PSK cho IKE (leftauth/rightauth = psk). id %any ⇒ áp cho mọi peer.
    ike-vpn {
        secret = "vpn"
    }
    # PPK (RFC 8784) — id + secret PHẢI khớp client demo (--ppk-id / --ppk).
    # id = ppk1 (giống ví dụ strongSwan): client gửi PPK_IDENTITY opaque [0x01]"ppk1".
    ppk-lab {
        id = ppk1
        secret = 0x0011223344556677889900112233445566778899001122334455667788990011
    }
}

pools {
    # Virtual IP + DNS đẩy qua Configuration Payload (INTERNAL_IP4_ADDRESS/DNS).
    ppk_pool {
        addrs = 10.40.0.0/24
        dns = 1.1.1.1
    }
}
